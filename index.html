<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テスト - 謎解きシステム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }

        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* スケルトンセルのスタイル */
        .skeleton-cell {
            width: 32px;
            height: 32px;
            border: 2px solid #3b82f6; /* 青色表示 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            background: rgba(30, 41, 59, 0.5);
            position: relative;
        }

        .cell-num {
            position: absolute;
            top: 1px;
            left: 1px;
            font-size: 10px;
            color: #93c5fd;
            line-height: 1;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 解答欄アニメーション */
        .success-flash {
            animation: flash 0.5s ease-out;
        }
        @keyframes flash {
            0% { background-color: #1e293b; }
            50% { background-color: #16a34a; }
            100% { background-color: #1e293b; }
        }
    </style>
</head>
<body>

    <!-- 1. スタート画面 -->
    <div id="screen-start" class="flex flex-col items-center justify-center h-screen">
        <h1 class="text-6xl font-bold mb-12 tracking-widest text-blue-400">テスト</h1>
        <button onclick="showIntro()" class="px-12 py-4 bg-blue-600 hover:bg-blue-500 rounded-full text-xl font-bold transition-all transform hover:scale-110 shadow-lg">
            開始
        </button>
    </div>

    <!-- 2. 説明画面 -->
    <div id="screen-intro" class="hidden min-h-screen bg-slate-900 py-20 px-6">
        <div class="max-w-2xl mx-auto space-y-32">
            <div class="fade-in text-2xl leading-relaxed text-center">
                ＊＊＊＊
            </div>
            <div class="fade-in text-lg leading-relaxed space-y-6">
                <p>ここには本番用の長い口上が入ります。</p>
                <p>あなたの物語はここから始まります。</p>
                <p>スクロールすると次々に言葉が現れるはずです。</p>
            </div>
            <div class="fade-in text-lg leading-relaxed">
                <p>準備はいいですか？</p>
                <p>真実は、あなたが今いる場所に隠されています。</p>
            </div>
            <div class="fade-in flex justify-center pb-20">
                <button onclick="showMain()" class="px-12 py-4 bg-cyan-600 hover:bg-cyan-500 rounded-lg text-xl font-bold transition-all shadow-xl">
                    始める
                </button>
            </div>
        </div>
    </div>

    <!-- 3. メイン画面 -->
    <div id="screen-main" class="hidden p-6 max-w-5xl mx-auto">
        <!-- 謎タブエリア -->
        <div id="nazo-container" class="bg-slate-800 rounded-2xl p-6 min-h-[450px] shadow-2xl mb-6 relative border border-slate-700">
            <div id="nazo-title" class="text-blue-400 text-sm font-bold mb-4 uppercase tracking-widest">Mission Control</div>
            
            <div id="nazo-display" class="flex flex-col h-full">
                <p class="text-slate-400 text-center my-auto">ボタンを押して謎を選択してください</p>
            </div>
        </div>

        <!-- 解答入力エリア (謎タブとボタンの間) -->
        <div id="answer-area" class="mb-8 hidden">
            <div class="flex gap-4 items-center bg-slate-900 p-4 rounded-xl border border-slate-700">
                <span class="font-bold text-slate-400">ANSWER:</span>
                <input type="text" id="user-answer" placeholder="答えを入力..." 
                       class="flex-1 bg-slate-800 border border-slate-600 rounded px-4 py-2 focus:outline-none focus:border-blue-500 uppercase tracking-widest">
                <button onclick="checkAnswer()" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded font-bold transition-colors">送信</button>
            </div>
            <div id="answer-message" class="text-center mt-2 font-bold h-6"></div>
        </div>

        <!-- ボタンエリア -->
        <div class="grid grid-cols-5 gap-4">
            <button onclick="loadNazo(1)" class="py-4 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold transition-colors border-b-4 border-slate-900 active:border-0 active:translate-y-1">[1]</button>
            <button onclick="loadNazo(2)" class="py-4 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold transition-colors border-b-4 border-slate-900 active:border-0 active:translate-y-1">[2]</button>
            <button onclick="loadNazo(3)" class="py-4 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold transition-colors border-b-4 border-slate-900 active:border-0 active:translate-y-1">[3]</button>
            <button onclick="loadNazo(4)" class="py-4 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold transition-colors border-b-4 border-slate-900 active:border-0 active:translate-y-1">[4]</button>
            <button onclick="loadNazo(5)" class="py-4 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold transition-colors border-b-4 border-slate-900 active:border-0 active:translate-y-1">[5]</button>
        </div>
    </div>

    <script>
        // --- データ定義 ---
        const team_a = ["hokkaido", "aomori", "akita", "iwate", "miyagi", "yamagata", "fukushima", "ibaraki", "gunma", "saitama", "chiba", "kanagawa", "niigata", "toyama", "ishikawa", "yamanashi", "nagano", "shizuoka", "aichi", "shiga", "osaka", "nara", "wakayama", "shimane", "okayama", "hiroshima", "yamaguchi", "tokushima", "kagawa", "fukuoka", "saga", "nagasaki", "oita", "kumamoto", "miyazaki", "kagoshima", "okinawa"];
        const team_o = ["tochigi", "tokyo", "kyoto", "hyogo", "tottori", "kochi"];
        const team_i = ["fukui", "gifu", "mie", "ehime"];

        let userPref = "UNKNOWN";
        let userTeam = null; 
        let currentNazo = 0;

        // --- IPアドレス/場所取得 ---
        async function fetchLocation() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                userPref = data.region ? data.region.toLowerCase() : "unknown";
                
                if (team_a.includes(userPref)) userTeam = 'a';
                else if (team_o.includes(userPref)) userTeam = 'o';
                else if (team_i.includes(userPref)) userTeam = 'i';
            } catch (error) {
                console.error("Location fetch failed", error);
            }
        }

        // --- 画面遷移 ---
        function showIntro() {
            document.getElementById('screen-start').classList.add('hidden');
            const intro = document.getElementById('screen-intro');
            intro.classList.remove('hidden');
            fetchLocation();
            initFadeIn();
        }

        function showMain() {
            document.getElementById('screen-intro').classList.add('hidden');
            document.getElementById('screen-main').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function initFadeIn() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('visible');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
        }

        // --- 謎の読み込み ---
        function loadNazo(id) {
            currentNazo = id;
            const display = document.getElementById('nazo-display');
            const title = document.getElementById('nazo-title');
            const answerArea = document.getElementById('answer-area');
            const answerInput = document.getElementById('user-answer');
            const message = document.getElementById('answer-message');
            
            title.innerText = `Mission [${id}]`;
            answerArea.classList.remove('hidden');
            answerInput.value = "";
            message.innerText = "";
            
            if (id === 1) {
                renderPrefecturePuzzle(display);
            } else {
                display.innerHTML = `<div class="flex flex-col items-center justify-center h-full"><h2 class="text-2xl font-bold">謎 ${id}</h2><p class="mt-4 text-slate-400">（この謎はまだロックされています）</p></div>`;
            }
        }

        // 解答チェック
        function checkAnswer() {
            const val = document.getElementById('user-answer').value.trim().toLowerCase();
            const message = document.getElementById('answer-message');
            
            if (currentNazo === 1) {
                if (val === "danger") {
                    message.innerText = "CORRECT!";
                    message.className = "text-center mt-2 font-bold h-6 text-green-400";
                    document.getElementById('nazo-container').classList.add('success-flash');
                    setTimeout(() => document.getElementById('nazo-container').classList.remove('success-flash'), 500);
                } else {
                    message.innerText = "WRONG...";
                    message.className = "text-center mt-2 font-bold h-6 text-red-400";
                }
            }
        }

        // --- スケルトンパズルレンダリング ---
        function renderPrefecturePuzzle(container) {
            const rows = 12;
            const cols = 10;
            let grid = Array(rows).fill().map(() => Array(cols).fill(null));

            const baseWord = "NEGAIGOTO";
            const nafuda = "NAFUDA";
            const omoide = "OMOIDE";
            const pref = userPref.toUpperCase();

            const baseRow = 4;
            const baseCol = 0;

            // 1. NEGAIGOTO配置 (Row 4)
            // 数値: N=3 (idx 0), G=4 (idx 2), A=2 (idx 3) -> 3*42*****
            for(let i=0; i<baseWord.length; i++) {
                let num = null;
                if (i === 0) num = 3;
                if (i === 2) num = 4;
                if (i === 3) num = 2;
                grid[baseRow][baseCol + i] = { char: baseWord[i], num: num };
            }

            // 2. NAFUDA配置 (Col 0でクロス)
            // 数値: D=1 (idx 4) -> 3***1*
            for(let i=0; i<nafuda.length; i++) {
                if (i === 0) continue; // Baseですでに設定済み
                let num = (i === 4) ? 1 : null;
                grid[baseRow + i][baseCol] = { char: nafuda[i], num: num };
            }

            // 3. OMOIDE配置 (Col 6でクロス)
            // 数値: E=5 (idx 5) -> *****5
            const omoideOffset = 2; 
            for(let i=0; i<omoide.length; i++) {
                if (i === omoideOffset) continue; // Baseですでに設定済み
                let num = (i === 5) ? 5 : null;
                grid[baseRow - omoideOffset + i][baseCol + 6] = { char: omoide[i], num: num };
            }

            // 4. 都道府県配置
            let prefCrossIndex = -1;
            if (userTeam === 'a') prefCrossIndex = 3;
            else if (userTeam === 'i') prefCrossIndex = 4;
            else if (userTeam === 'o') prefCrossIndex = 8;

            if (prefCrossIndex !== -1) {
                const targetChar = baseWord[prefCrossIndex];
                const prefIdx = pref.indexOf(targetChar);
                if (prefIdx !== -1) {
                    for(let i=0; i<pref.length; i++) {
                        if (i === prefIdx) continue;
                        const r = baseRow - prefIdx + i;
                        const c = baseCol + prefCrossIndex;
                        if (r >= 0 && r < rows) grid[r][c] = { char: pref[i], num: null };
                    }
                }
            }

            // HTML構築 (左右分割)
            let html = `
            <div class="flex flex-col md:flex-row gap-8 h-full items-start">
                <!-- 左側: スケルトン -->
                <div class="flex-1 flex flex-col items-center">
                    <div class="inline-grid gap-1 bg-slate-900/30 p-4 rounded-lg" style="grid-template-columns: repeat(${cols}, 32px);">
                        ${grid.map(row => row.map(cell => `
                            <div class="skeleton-cell ${cell ? 'border-blue-500' : 'border-transparent'}">
                                ${cell && cell.num ? `<span class="cell-num">${cell.num}</span>` : ''}
                            </div>
                        `).join('')).join('')}
                    </div>
                    
                    <!-- 12345R = ? -->
                    <div class="mt-8 flex items-center gap-2 font-bold text-xl">
                        <span class="tracking-widest">12345R = </span>
                        <span class="w-10 h-10 bg-red-600 flex items-center justify-center text-white rounded">?</span>
                    </div>
                </div>

                <!-- 右側: 単語リスト -->
                <div class="w-full md:w-64 bg-slate-700/50 p-6 rounded-xl border border-slate-600 self-stretch">
                    <h3 class="text-blue-400 font-bold mb-4 border-b border-slate-600 pb-2">WORD LIST</h3>
                    <ul class="space-y-4 font-bold tracking-wider">
                        <li class="text-sm opacity-80">・あなたの住んでいる都道府県</li>
                        <li>・NEGAIGOTO</li>
                        <li>・NAFUDA</li>
                        <li>・OMOIDE</li>
                    </ul>
                </div>
            </div>
            `;
            
            // コメントアウト: ※IPアドレスに基づき～
            // html += `<p class="mt-6 text-xs text-slate-500 italic">※IPアドレスに基づき、${userPref} チームの配置が生成されました。</p>`;
            
            container.innerHTML = html;
        }
    </script>
</body>
</html>
