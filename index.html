<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>謎解きシステム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }

        /* スケルトンセルのスタイル */
        .skeleton-cell {
            width: 32px;
            height: 32px;
            border: 2px solid #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            background: rgba(30, 41, 59, 0.5);
            position: relative;
        }

        .cell-num {
            position: absolute;
            top: 1px;
            left: 1px;
            font-size: 10px;
            color: #93c5fd;
            line-height: 1;
        }

        /* 正解時フラッシュ */
        .success-flash {
            animation: flash 0.5s ease-out;
        }
        @keyframes flash {
            0% { background-color: #1e293b; }
            50% { background-color: #16a34a; }
            100% { background-color: #1e293b; }
        }

        /* 赤背景のハテナ */
        .question-box {
            background-color: #dc2626;
            color: white;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: 900;
            font-size: 1.2rem;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.4);
        }
    </style>
</head>
<body>

    <!-- メイン画面 (最初から表示) -->
    <div id="screen-main" class="p-4 max-w-5xl mx-auto flex flex-col justify-center min-h-screen">
        <div id="nazo-container" class="bg-slate-800 rounded-2xl p-6 min-h-[480px] shadow-2xl mb-6 relative border border-slate-700">
            <div id="nazo-title" class="text-blue-400 text-sm font-bold mb-4 uppercase tracking-widest">Mission Control</div>
            <div id="nazo-display" class="flex flex-col h-full">
                <!-- ここに謎が自動で描画される -->
            </div>
        </div>

        <!-- 解答入力エリア -->
        <div id="answer-area" class="mb-8">
            <div class="flex gap-4 items-center bg-slate-900 p-4 rounded-xl border border-slate-700">
                <span class="font-bold text-slate-400">ANSWER:</span>
                <input type="text" id="user-answer" placeholder="答えを入力..." 
                       class="flex-1 bg-slate-800 border border-slate-600 rounded px-4 py-2 focus:outline-none focus:border-blue-500 uppercase tracking-widest">
                <button onclick="checkAnswer()" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded font-bold transition-colors">送信</button>
            </div>
            <div id="answer-message" class="text-center mt-2 font-bold h-6"></div>
            
            <!-- X投稿エリア (初期は非表示) -->
            <div id="share-area" class="hidden flex justify-center mt-6">
                <a id="share-x-btn" href="#" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 px-8 py-4 bg-black hover:bg-gray-800 text-white rounded-full text-lg font-bold transition-transform transform hover:scale-105 shadow-lg border border-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                    </svg>
                    Xに投稿する！
                </a>
            </div>
        </div>
    </div>

    <script>
        let userPref = "UNKNOWN";
        let userTeam = null; 

        // --- 初期設定 ---
        async function fetchLocation() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                userPref = data.region ? data.region.toLowerCase() : "unknown";
                const team_a = ["hokkaido", "aomori", "akita", "iwate", "miyagi", "yamagata", "fukushima", "ibaraki", "gunma", "saitama", "chiba", "kanagawa", "niigata", "toyama", "ishikawa", "yamanashi", "nagano", "shizuoka", "aichi", "shiga", "osaka", "nara", "wakayama", "shimane", "okayama", "hiroshima", "yamaguchi", "tokushima", "kagawa", "fukuoka", "saga", "nagasaki", "oita", "kumamoto", "miyazaki", "kagoshima", "okinawa"];
                const team_o = ["tochigi", "tokyo", "kyoto", "hyogo", "tottori", "kochi"];
                const team_i = ["fukui", "gifu", "mie", "ehime"];
                if (team_a.includes(userPref)) userTeam = 'a';
                else if (team_o.includes(userPref)) userTeam = 'o';
                else if (team_i.includes(userPref)) userTeam = 'i';
            } catch (e) { 
                console.error("Location fetch failed", e); 
            }
        }

        // ページロード時に即座に謎を表示
        window.onload = async function() {
            await fetchLocation();
            loadNazo();
        };

        function loadNazo() {
            const display = document.getElementById('nazo-display');
            document.getElementById('user-answer').value = "";
            document.getElementById('answer-message').innerText = "";
            renderPrefecturePuzzle(display);
        }

        function checkAnswer() {
            const val = document.getElementById('user-answer').value.trim().toLowerCase();
            const msg = document.getElementById('answer-message');
            
            if (val === "danger") {
                msg.innerText = "CORRECT!";
                msg.className = "text-center mt-2 font-bold h-6 text-green-400";
                document.getElementById('nazo-container').classList.add('success-flash');
                setTimeout(() => document.getElementById('nazo-container').classList.remove('success-flash'), 500);
                
                // 正解時にX投稿ボタンを表示し、リンクをセット
                showShareButton();
            } else {
                msg.innerText = "WRONG...";
                msg.className = "text-center mt-2 font-bold h-6 text-red-400";
            }
        }

        function showShareButton() {
            const shareArea = document.getElementById('share-area');
            const shareBtn = document.getElementById('share-x-btn');
            
            const shareText = `https://maruten0420.github.io/oneday-nazo-performance/\nあなたは一枚謎に正解した！\n#謎解き`;
            const shareUrl = `https://x.com/intent/tweet?text=${encodeURIComponent(shareText)}`;
            
            shareBtn.href = shareUrl;
            shareArea.classList.remove('hidden');
        }

        // --- 謎: スケルトン ---
        function renderPrefecturePuzzle(container) {
            const rows = 12, cols = 10;
            let grid = Array(rows).fill().map(() => Array(cols).fill(null));
            const baseRow = 4, baseCol = 0;
            const baseWord = "NEGAIGOTO", nafuda = "NAFUDA", omoide = "OMOIDE", pref = userPref.toUpperCase();

            // NEGAIGOTO配置
            for(let i=0; i<baseWord.length; i++) {
                grid[baseRow][baseCol + i] = { char: baseWord[i], num: (i===0?3 : i===2?4 : i===3?2 : null) };
            }
            // NAFUDA配置
            for(let i=1; i<nafuda.length; i++) {
                grid[baseRow + i][baseCol] = { char: nafuda[i], num: (i===4?1:null) };
            }
            // OMOIDE配置
            const omoideOffset = 2; 
            for(let i=0; i<omoide.length; i++) {
                if(i===omoideOffset) continue;
                grid[baseRow - omoideOffset + i][baseCol + 6] = { char: omoide[i], num: (i===5?5:null) };
            }

            // 都道府県配置
            let pCol = (userTeam==='a'?3 : userTeam==='i'?4 : userTeam==='o'?8 : -1);
            if(pCol !== -1){
                const pIdx = pref.indexOf(baseWord[pCol]);
                if(pIdx!==-1) {
                    for(let i=0; i<pref.length; i++) {
                        if(i!==pIdx) {
                            const r = baseRow - pIdx + i;
                            if(r>=0 && r<rows) grid[r][baseCol+pCol] = { char: pref[i], num: null };
                        }
                    }
                }
            }

            container.innerHTML = `
                <div class="flex flex-col md:flex-row gap-6 h-full items-start">
                    <div class="flex-1 flex flex-col items-center w-full">
                        <div class="inline-grid gap-1 bg-slate-900/30 p-2 rounded-lg" style="grid-template-columns: repeat(${cols}, 32px);">
                            ${grid.map(row => row.map(cell => `
                                <div class="skeleton-cell ${cell ? 'border-blue-500' : 'border-transparent shadow-[0_0_8px_rgba(59,130,246,0.2)]'}">
                                    ${cell?.num ? `<span class="cell-num">${cell.num}</span>` : ''}
                                </div>`).join('')).join('')}
                        </div>
                        <div class="mt-8 flex items-center gap-2 font-bold text-xl">
                            <span class="tracking-widest">12345R = </span><div class="w-8 h-8 bg-red-600 flex items-center justify-center text-white rounded shadow-lg shadow-red-900/40">?</div>
                        </div>
                    </div>
                    <div class="w-full md:w-48 bg-slate-700/30 p-4 rounded-xl text-sm border border-slate-600/50">
                        <h3 class="text-blue-400 font-bold mb-3 border-b border-slate-600 pb-1">WORD LIST</h3>
                        <ul class="space-y-3 font-bold opacity-90 tracking-wider">
                            <li>・願い事</li>
                            <li>・名札</li>
                            <li>・思い出</li>
                            <li class="text-[10px] text-slate-400">・君が住んでいる都道府県</li>
                        </ul>
                    </div>
                </div>`;
        }
    </script>
</body>
</html>
